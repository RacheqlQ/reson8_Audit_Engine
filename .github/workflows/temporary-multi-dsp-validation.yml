name: Temporary multi-DSP validation

on:
  push:
    branches:
      - feat/multi-dsp-enrichment

permissions:
  contents: read

concurrency:
  group: temporary-multi-dsp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install declared dependencies
        run: npm install --no-audit --no-fund
      - name: Run repository test suite
        run: npm test
      - name: Build TypeScript
        run: npm run build
