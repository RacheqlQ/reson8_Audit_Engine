name: CI

on:
  push:
    branches: [main, feat/multi-dsp-enrichment, fix/production-resilience-acceptance-20261118]
  pull_request:
    branches: [main, fix/report-fixture-provenance-date, fix/production-resilience-acceptance-20261118]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm ci --global npm@11.21.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Upload generated npm lockfile for repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          if-no-files-found: error

      - name: Commit generated npm lockfile to remediation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/production-resilience-acceptance-20261118'
        run: |
          if [ -f package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: add npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify Render commands map to package scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const yaml = fs.readFileSync('render.yaml', 'utf8');
          const commands = [...yaml.matchAll(/^\s*(buildCommand|startCommand):\s*(.+)$/gm)];
          if (!commands.length) throw new Error('render.yaml has no buildCommand/startCommand');
          for (const [, key, raw] of commands) {
            const command = raw.trim().replace(/^['"]|['"]$/g, '');
            if (/^(?:npm|yarn|pnpm)\s+(?:install|ci)(?:\s|$)/.test(command)) {
              console.log('Verified package-manager command: ' + command.split(/\s+/).slice(0, 2).join(' '));
              continue;
            }
            const scriptName = command.match(/(?:npm|yarn|pnpm)\s+(?:run\s+)?([\w:-]+)/)?.[1];
            if (!scriptName || !pkg.scripts?.[scriptName]) {
              throw new Error(`Render ${key} does not map to an existing package.json script: ${command}`);
            }
            console.log(`Verified Render ${key}: ${scriptName}`);
          }
          for (const required of ['start', 'worker', 'build']) {
            if (!pkg.scripts?.[required]) throw new Error(`Missing required package script: ${required}`);
          }
          NODE

      - name: Run focused worker-hardening regressions
        run: >-
          npx vitest run
          tests/worker-provider-preflight.test.ts
          tests/worker-heartbeat-timeout.test.ts
          tests/process-audit-job.test.ts
          tests/main.test.ts
          tests/groq-client.test.ts
          tests/groq-assessment-deadline.test.ts

      - name: Run test suite
        if: always()
        run: npm test

      - name: Build
        if: always()
        run: npm run build

      - name: Install PDF text-inspection tools
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate and inspect sample reports
        if: always()
        run: npm run sample-report

      - name: Upload report PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-pdfs
          path: artifacts/*.pdf
          if-no-files-found: warn
