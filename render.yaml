services:
  - type: web
    name: reson8-audit-engine
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://gznwamoxuxzaayjaxvlo.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AUDD_API
        sync: false
      - key: GROQ_API
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: RESON8_OPERATOR_KEY
        sync: false

